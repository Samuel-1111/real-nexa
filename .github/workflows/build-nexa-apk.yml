name: Build and Publish NEXA APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-nexa-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Create temporary signing key
        working-directory: android
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore nexa-release-temp.jks \
            -alias nexa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexa-temp-password \
            -keypass nexa-temp-password \
            -dname "CN=NEXA, OU=Samzy Technology, O=Samzy Technology, L=Ogun, ST=Ogun, C=NG"

      - name: Align and sign APK
        working-directory: android
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/NEXA-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks nexa-release-temp.jks \
            --ks-pass pass:nexa-temp-password \
            --key-pass pass:nexa-temp-password \
            --out app/build/outputs/apk/release/NEXA.apk \
            app/build/outputs/apk/release/NEXA-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/NEXA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Android-APK
          path: android/app/build/outputs/apk/release/NEXA.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexa-${{ github.run_number }}
          name: NEXA Android ${{ github.run_number }}
          body: NEXA Android investor/public test build. Install the APK directly on Android.
          files: android/app/build/outputs/apk/release/NEXA.apk
